name: Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Accept licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
      - name: Own API keys and arm64 only
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
        run: |
          echo "APP_ID length: ${#APP_ID}, APP_HASH length: ${#APP_HASH}"
          if [ -z "$APP_ID" ] || [ -z "$APP_HASH" ]; then
            echo "Secret APP_ID or APP_HASH is empty"; exit 1
          fi
          F=TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          sed -i "s/APP_ID = 4;/APP_ID = $APP_ID;/" $F
          sed -i "s/APP_HASH = \"[0-9a-f]*\"/APP_HASH = \"$APP_HASH\"/" $F
          sed -i 's/abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"/abiFilters "arm64-v8a"/' TMessagesProj_App/build.gradle
      - name: Build
        run: |
          printf 'org.gradle.parallel=true\norg.gradle.caching=true\n' >> gradle.properties
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: TimeGram-apk
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
