name: Build
on:
  push:
    branches: [ main, rebrand ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install SDK and NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "ndk;29.0.14206865"
      - name: Secrets
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          {
            echo "APP_ID = $APP_ID"
            echo "APP_HASH = \"$APP_HASH\""
            echo "MAPS_V2_API = "
            echo "SIGNING_KEY_PASSWORD = $KEY_PASSWORD"
            echo "SIGNING_KEY_ALIAS = $KEY_ALIAS"
            echo "SIGNING_KEY_STORE_PASSWORD = $KEYSTORE_PASSWORD"
          } > API_KEYS
          mkdir -p TMessagesProj/config
          echo "$KEYSTORE_BASE64" | base64 -d > TMessagesProj/config/TimeGram.jks
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj:assembleFullArm64Debug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: TimeGram-apk
          path: TMessagesProj/build/outputs/apk/**/*.apk
