name: Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Accept licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
      - name: Own API keys and arm ABIs only
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
        run: |
          echo "APP_ID length: ${#APP_ID}, APP_HASH length: ${#APP_HASH}"
          if [ -z "$APP_ID" ] || [ -z "$APP_HASH" ]; then
            echo "Secret APP_ID or APP_HASH is empty"; exit 1
          fi
          F=TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          sed -i "s/APP_ID = 4;/APP_ID = $APP_ID;/" $F
          sed -i "s/APP_HASH = \"[0-9a-f]*\"/APP_HASH = \"$APP_HASH\"/" $F
          sed -i 's/abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"/abiFilters "armeabi-v7a", "arm64-v8a"/' TMessagesProj_App/build.gradle
          printf 'org.gradle.parallel=true\norg.gradle.caching=true\norg.gradle.jvmargs=-Xmx5g -XX:+UseParallelGC\n' >> gradle.properties
      - name: Own google-services.json
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_B64 }}
        run: |
          if [ -n "$GS_B64" ]; then echo "$GS_B64" | base64 -d > TMessagesProj_App/google-services.json; fi
      - name: Install ccache
        run: sudo apt-get install -y ccache
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-
      - name: Build
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_DIR: /home/runner/.ccache
          CCACHE_MAXSIZE: 2G
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_COMPILERCHECK: content
          CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatDebug --build-cache --stacktrace
      - name: ccache stats
        if: always()
        run: ccache -s || true
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.run_id }}
      - name: Where is the APK
        if: always()
        run: find . -path ./.git -prune -o \( -name '*.apk' -o -name '*.aab' \) -print
      - name: Inspect APK
        if: always()
        continue-on-error: true
        run: |
          APK=$(find TMessagesProj_App/build -name app.apk | head -1)
          echo "APK=$APK"
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "== build-tools: $BT"; ls -l $APK
          echo "== apksigner verify"; $BT/apksigner verify --verbose --print-certs $APK 2>&1 | head -20 || true
          echo "== zipalign check"; $BT/zipalign -c -P 16 -v 4 $APK 2>&1 | tail -5 || true
          echo "== badging"; $BT/aapt2 dump badging $APK 2>&1 | head -40 || true
          echo "== arsc/dex entries"; unzip -v $APK | grep -E "resources.arsc|classes|AndroidManifest|lib/" | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: TimeGram-apk
          path: |
            TMessagesProj_App/build/intermediates/apk/**/*.apk
            **/build/outputs/**/*.apk
            **/build/outputs/**/*.aab
          if-no-files-found: error
